<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe 
    src="https://truffled.lol/browser/frame/?mode=preview&url=https%3A%2F%2Fnowgg.fun%2Fapps%2Fa%2F19900%2Fb.html" 
    allow="fullscreen; gamepad; autoplay; clipboard-write; focus-without-user-activation" 
    allowfullscreen>
  </iframe>

  <script src="app.js"></script>
</body>
</html>
